name: Build Patched Upstream Backend

on:
  schedule:
    # The official self-hosted image is built from get-convex's release branch.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch, tag, or commit to build"
        required: false
        default: release
        type: string
      force_rebuild:
        description: "Rebuild even if the upstream SHA tag already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-patched-upstream-backend
  cancel-in-progress: false

jobs:
  build:
    name: Patch and publish backend image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out fork automation files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: fork
          persist-credentials: false

      - name: Check out upstream release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: get-convex/convex-backend
          ref: ${{ inputs.upstream_ref || 'release' }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Apply Cloudflare R2 patch
        working-directory: source
        run: |
          patch_file="../fork/patches/cloudflare-r2-uniform-parts.patch"
          if git apply --check "$patch_file"; then
            git apply "$patch_file"
          elif git apply --reverse --check "$patch_file"; then
            echo "The upstream source already contains this patch."
          else
            echo "::error::The R2 patch no longer applies to the upstream release."
            exit 1
          fi
          git diff --check

      - name: Compute image metadata
        id: release
        working-directory: source
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          upstream_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          commit_timestamp="$(git show -s --format=%cI HEAD | date -f - --utc '+%Y-%m-%dT%H:%M:%SZ')"
          echo "image=ghcr.io/${owner}/convex-backend" >> "$GITHUB_OUTPUT"
          echo "sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "commit_timestamp=${commit_timestamp}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          IMAGE: ${{ steps.release.outputs.image }}
          UPSTREAM_SHA: ${{ steps.release.outputs.sha }}
        run: |
          exists=false
          if [[ "$FORCE_REBUILD" != "true" ]] && \
            docker buildx imagetools inspect "$IMAGE:$UPSTREAM_SHA" >/dev/null 2>&1; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Build and push patched backend
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: source
          file: source/self-hosted/docker-build/Dockerfile.backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.sha }}
            ${{ steps.release.outputs.image }}:upstream-${{ steps.release.outputs.short_sha }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.description=Convex backend with the Cloudflare R2 multipart upload patch
          build-args: |
            VERGEN_GIT_SHA=${{ steps.release.outputs.sha }}
            VERGEN_GIT_COMMIT_TIMESTAMP=${{ steps.release.outputs.commit_timestamp }}
          cache-from: type=gha,scope=patched-convex-backend
          cache-to: type=gha,mode=max,scope=patched-convex-backend

      - name: Refresh moving tags for an existing image
        if: steps.existing.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          UPSTREAM_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:upstream-$SHORT_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$UPSTREAM_SHA"

      - name: Write summary
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          UPSTREAM_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "## Patched Convex backend"
            echo
            echo "Published \`$IMAGE:$UPSTREAM_SHA\` and \`$IMAGE:latest\`."
            echo
            echo "Upstream source: \`get-convex/convex-backend@$UPSTREAM_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
